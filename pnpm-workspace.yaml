packages:
  - "apps/*"
  - "packages/*"
  - "integrations/*"
  - "tests/*"
  # Experimental spikes only; never shipped, never imported by apps/.
  - "spikes/*"

# Every dependency version lives here so a package.json can only ask for a name.
# Bumping a version means editing this file, which shows up in the task's own commit.
catalog:
  "@lucide/svelte": 1.55.0
  "@microsoft/tui-test": 0.1.0
  "@opentui/core": 0.6.0
  "@opentui/react": 0.6.0
  "@sveltejs/adapter-static": 3.0.1
  "@sveltejs/kit": 2.70.3
  "@sveltejs/vite-plugin-svelte": 7.3.0
  "@tailwindcss/vite": 4.3.3
  "@tauri-apps/cli": 2.12.2
  "@types/mocha": 10.0.10
  "@types/node": 26.5.1
  "@wdio/cli": 9.32.0
  "@wdio/local-runner": 9.32.0
  "@wdio/mocha-framework": 9.32.0
  "@wdio/spec-reporter": 9.32.0
  "@wdio/tauri-service": 1.5.0
  "@types/react": 19.3.0
  "@uniview/tui-core": 0.0.3
  "@uniview/tui-solid": 0.0.4
  "@types/vscode": 1.90.0
  bits-ui: 2.19.5
  clsx: 2.1.1
  esbuild: 0.28.2
  hono: 4.13.8
  "@hono/node-server": 2.1.1
  react: 19.3.0
  solid-js: 1.9.17
  svelte: 5.57.2
  svelte-check: 4.7.6
  tailwind-merge: 3.7.0
  tailwind-variants: 3.3.1
  tailwindcss: 4.3.3
  turbo: 2.10.12
  typescript: 5.9.2
  vite: 8.3.4
  vitest: 4.1.11
  zod: 4.6.5

# esbuild's install script only places its own platform binary; nothing else
# in the workspace is allowed to run install scripts.
allowBuilds:
  esbuild: true
  # webdriverio pulls edge/gecko driver installers; macOS uses the embedded
  # driver instead, but pnpm still wants an explicit verdict for their scripts.
  edgedriver: true
  geckodriver: true

minimumReleaseAgeExclude:
  - "@opentui/core-darwin-arm64@0.6.0"
  - "@opentui/core-darwin-x64@0.6.0"
  - "@opentui/core-linux-arm64-musl@0.6.0"
  - "@opentui/core-linux-arm64@0.6.0"
  - "@opentui/core-linux-x64-musl@0.6.0"
  - "@opentui/core-linux-x64@0.6.0"
  - "@opentui/core-win32-arm64@0.6.0"
  - "@opentui/core-win32-x64@0.6.0"
  - "@opentui/core@0.6.0"
  - "@opentui/react@0.6.0"
  - "@lucide/svelte@1.55.0"
  - "@tauri-apps/cli-darwin-arm64@2.12.2"
  - "@tauri-apps/cli-darwin-x64@2.12.2"
  - "@tauri-apps/cli-linux-arm-gnueabihf@2.12.2"
  - "@tauri-apps/cli-linux-arm64-gnu@2.12.2"
  - "@tauri-apps/cli-linux-arm64-musl@2.12.2"
  - "@tauri-apps/cli-linux-riscv64-gnu@2.12.2"
  - "@tauri-apps/cli-linux-x64-gnu@2.12.2"
  - "@tauri-apps/cli-linux-x64-musl@2.12.2"
  - "@tauri-apps/cli-win32-arm64-msvc@2.12.2"
  - "@tauri-apps/cli-win32-ia32-msvc@2.12.2"
  - "@tauri-apps/cli-win32-x64-msvc@2.12.2"
  - "@tauri-apps/cli@2.12.2"
