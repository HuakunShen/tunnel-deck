# The desktop shell is its own workspace, and that is the point of this file.
#
# `cargo build` at the repository root must never need a WebView: the tunnel
# backend is TypeScript, and nothing in this shell may pull WebView deps into
# any other build. Keeping the desktop crate in a separate workspace makes
# that structural — nothing else in this repo can reach these dependencies.
[workspace]

[package]
name = "ssh-tunnel-desktop"
version = "0.1.0"
description = "SSH tunnel manager desktop shell: spawns the tunnel daemon sidecar and opens the Web UI."
edition = "2021"
rust-version = "1.77"
license = "MIT"
publish = false

[lib]
name = "ssh_tunnel_desktop"
path = "src/lib.rs"

[[bin]]
name = "ssh-tunnel-desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# In-app updates (signed; see plugins.updater in tauri.conf.json). The page
# drives it through @tauri-apps/plugin-updater, so this shell only hosts it.
tauri-plugin-updater = "2"
# Relaunch after an update install. Same split as upstream: the page calls it,
# the shell only permits it.
tauri-plugin-process = "2"
# Exactly one manager may own these tunnels: a second launch focuses the
# running window instead of starting a rival manager over the same ports and
# control sockets.
tauri-plugin-single-instance = "2"
# Embedded WebDriver server for `pnpm test:e2e` (WebdriverIO, embedded
# provider). Release-only surface: debug builds skip it via cfg below.
tauri-plugin-wdio-webdriver = "1.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The tunnel domain, linked in-process: no sidecar, no port, no runtime probe.
# (Path leaves this isolated workspace; nothing flows the other way, so the
# headless `cargo build` at the repo root still never sees a WebView.)
tunnel-core = { path = "../../../crates/tunnel-core" }

[target.'cfg(target_os = "macos")'.dependencies]
# Native window material. macOS 26+ gets Liquid Glass; older systems fall back
# to a vibrancy effect. Without this the window is an opaque rectangle and the
# page's translucency has nothing to show through.
window-vibrancy = "0.8.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSColor", "NSView", "NSVisualEffectView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

[target.'cfg(windows)'.dependencies]
# Windows 11 acrylic for the same reason as macOS above.
window-vibrancy = "0.8.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
