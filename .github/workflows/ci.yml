# CI: typecheck, boundary check and the portable test suite.
#
# The TUI render snapshots are excluded here: OpenTUI's renderer needs a native
# FFI that is not available under this vitest setup (it fails the same way
# locally under node and bun). Everything else in `pnpm test` runs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check — ${{ matrix.os }}
    # The tool ships for all three desktops, so the CLI, daemon and tests are
    # gated on all three, not just the development machine.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck every package
        run: pnpm check

      - name: Package boundaries
        run: pnpm check:boundaries

      # The build stages the Web UI into the DSH plugin package, which one of
      # the contract tests serves; run it before the suite, not after.
      - name: Build the daemon, CLI, TUI and Web UI
        run: pnpm build

      - name: Tests
        run: pnpm test:ci

      # Pure-JS terminal UI (Uniview + Solid): no native binding, so unlike the
      # OpenTUI one excluded from `test:ci` it runs anywhere.
      - name: Solid TUI tests
        run: pnpm --filter @ssh-tunnel/tui-solid test

      # A real daemon and the real CLI against it, on every OS: the API, the
      # bundled Web UI and the CLI's discovery all have to work end to end.
      - name: Smoke test the daemon, Web UI and CLI
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/smoke-home" USERPROFILE="$RUNNER_TEMP/smoke-home"
          mkdir -p "$HOME"
          node apps/server/dist/server.mjs --port=7499 --web-dir=apps/web/dist &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:7499/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:7499/ | grep -qi "<html"
          node apps/cli/dist/cli.mjs list --daemon=http://127.0.0.1:7499
          kill %1

  # The headless Rust core is the other half of the contract: `fixtures/`
  # adjudicates the TypeScript and Rust implementations against each other, so
  # both suites run here. Ubuntu is enough — the crate is WebView-free by
  # construction, and the shell matrix below covers the OS-specific branches.
  core:
    name: tunnel-core — test + clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Tests (unit + cross-language fixtures)
        run: cargo test -p tunnel-core

      - name: Clippy, warnings deny
        run: cargo clippy -p tunnel-core --all-targets -- -D warnings

  # The release builds the shell on three operating systems; if one of them
  # stops compiling, a tag is the worst place to find out. `cargo check` is the
  # cheap half of `tauri build` — it never links a bundle, but it compiles every
  # `#[cfg]` branch this host can reach.
  desktop:
    name: shell — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux WebView prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # `generate_context!` and `tauri-build` only require the bundled paths to
      # exist, so stubs stand in for the real artifacts here: the release job
      # builds them, and nothing from a `cargo check` is ever packaged.
      - name: Stub the bundled artifacts
        shell: bash
        run: |
          mkdir -p apps/web/dist apps/server/dist
          echo '<!doctype html>' > apps/web/dist/index.html
          echo '// stub' > apps/server/dist/server.mjs

      - name: Check the shell
        working-directory: apps/desktop/src-tauri
        run: cargo check --workspace

      - name: Shell unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test


  # Compiling the shell proves it builds; this proves it *starts*. The real
  # desktop binary is launched against the real bundled daemon and Web UI, and
  # the daemon it spawns has to answer — the path a user's double-click takes.
  # Linux needs a virtual display; Windows runners already have WebView2.
  desktop-run:
    name: launch — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux WebView prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build the daemon and Web UI the shell bundles
        run: pnpm build

      - name: Build the shell
        working-directory: apps/desktop/src-tauri
        run: cargo build

      - name: Launch the desktop app and wait for its daemon
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/desktop-home" USERPROFILE="$RUNNER_TEMP/desktop-home"
          mkdir -p "$HOME"
          cd apps/desktop/src-tauri
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./target/debug/ssh-tunnel-desktop.exe &
          else
            xvfb-run -a ./target/debug/ssh-tunnel-desktop &
          fi
          ok=0
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:7432/api/health; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || { echo "the desktop app never started its daemon"; exit 1; }
          curl -fs http://127.0.0.1:7432/ | grep -qi "<html"
          # The shell must still be alive, not a daemon left by a crashed window.
          if [ "$RUNNER_OS" = "Windows" ]; then
            tasklist | grep -i ssh-tunnel-desktop
          else
            pgrep -f target/debug/ssh-tunnel-desktop
          fi

  # The one thing no unit test can say: that a profile really becomes a working
  # tunnel. A real `sshd` runs on the runner, the daemon starts a tunnel to
  # it, and traffic crosses it and comes back.
  tunnel:
    name: tunnel — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the daemon
        run: pnpm --filter @ssh-tunnel/server build

      - name: Tunnel through a real sshd (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_e2e
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/hostkey"
          cat ~/.ssh/id_e2e.pub >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          # Its own config file: the default one includes /etc/ssh/sshd_config.d,
          # which an unprivileged sshd may not read.
          cat > "$RUNNER_TEMP/sshd_config" <<CONF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $RUNNER_TEMP/hostkey
          PidFile $RUNNER_TEMP/sshd.pid
          AuthorizedKeysFile $HOME/.ssh/authorized_keys
          PubkeyAuthentication yes
          StrictModes no
          UsePAM no
          CONF
          /usr/sbin/sshd -f "$RUNNER_TEMP/sshd_config"
          sleep 1
          E2E_SSH_PORT=2222 E2E_SSH_USER="$(id -un)" E2E_SSH_KEY="$HOME/.ssh/id_e2e" \
            node scripts/e2e-tunnel.mjs

      - name: Tunnel through a real sshd (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          }
          Start-Service sshd
          $ssh = Join-Path $env:USERPROFILE ".ssh"
          New-Item -ItemType Directory -Force $ssh | Out-Null
          $key = Join-Path $ssh "id_e2e"
          # Through cmd: PowerShell would hand ssh-keygen a literal `""` as the
          # passphrase, and BatchMode cannot answer a passphrase prompt.
          $env:E2E_KEYFILE = $key
          Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP "keygen.cmd") 'ssh-keygen -q -t ed25519 -N "" -f "%E2E_KEYFILE%"'
          cmd /c (Join-Path $env:RUNNER_TEMP "keygen.cmd")
          # The runner user is an administrator, so sshd reads this file instead
          # of ~/.ssh/authorized_keys, and insists on a locked-down ACL for it.
          $auth = Join-Path $env:ProgramData "ssh\administrators_authorized_keys"
          Get-Content "$key.pub" | Set-Content -Encoding ascii $auth
          icacls $auth /inheritance:r /grant "SYSTEM:F" /grant "BUILTIN\Administrators:F" | Out-Null
          Restart-Service sshd
          $env:E2E_SSH_PORT = "22"
          $env:E2E_SSH_USER = $env:USERNAME
          $env:E2E_SSH_KEY = $key
          node scripts/e2e-tunnel.mjs
