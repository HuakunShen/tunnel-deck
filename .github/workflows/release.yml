# Release: build the desktop app for every supported platform and publish the
# bundles on one GitHub Release.
#
# `v0.2.0` -> one Release carrying
#   TunnelDeck-0.2.0-macos-arm64.dmg / .zip / .app.tar.gz (+ .sig)
#   TunnelDeck-0.2.0-macos-x64.dmg / .zip / .app.tar.gz (+ .sig)
#   TunnelDeck-0.2.0-linux-x64.deb / .AppImage / .AppImage.tar.gz (+ .sig)
#   TunnelDeck-0.2.0-windows-x64-setup.exe / -setup.nsis.zip (+ .sig)
#   latest.json (the updater feed)
# A manual run without a tag builds the same artifacts and keeps them as
# workflow artifacts instead of publishing anything.
#
# macOS bundles are ad-hoc signed only (no Developer ID here), so a downloaded
# copy carries the quarantine flag: right-click > Open the first time, or strip
# it with `xattr -dr com.apple.quarantine`. Adding APPLE_CERTIFICATE,
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY and the notarization
# secrets below would make the download open normally. Windows installers are
# unsigned for the same reason: SmartScreen shows "More info > Run anyway".
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # One deployment floor for both macOS builds. Without it the x86_64 build
  # inherits the SDK default and refuses to launch on the older systems its
  # users are most likely to run.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  bundle:
    name: bundle — ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            target: aarch64-apple-darwin
          - label: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            target: x86_64-apple-darwin
          - label: linux-x64
            os: ubuntu-22.04
            args: --bundles deb,appimage
            target: ""
          - label: windows-x64
            os: windows-latest
            args: --bundles nsis
            target: ""
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Linux WebView and packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # The shell embeds the Web UI as `frontendDist`, so it must exist before
      # `tauri build` copies it in. The CLI/TUI/daemon bundles also build here
      # (unchanged release surface for the npm line).
      - name: Build the daemon, CLI, TUI and Web UI
        run: pnpm build

      # Tag and bundle must agree: a `v0.2.0` tag that ships a 0.1.3 bundle is
      # how the download ends up lying about itself.
      - name: Stamp the bundle version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/set-app-version.mjs "$GITHUB_REF_NAME"

      - name: Resolve the bundle version
        shell: bash
        run: echo "APP_VERSION=$(node scripts/app-version.mjs)" >> "$GITHUB_ENV"

      # Unsigned (ad-hoc) build. To sign and notarize, declare the secrets and
      # put these back on the step below: Tauri imports the certificate when the
      # variables exist, and an *empty* APPLE_CERTIFICATE makes it try (and
      # fail) to import nothing, so they must stay absent until real values are
      # configured.
      #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      #
      # `pnpm run <script> -- ...` would hand the `--` to tauri, which then
      # forwards `--bundles` to cargo. Call the CLI directly instead.
      #
      # The updater key signs every build (manual runs included, so the
      # artifacts are identical to a tagged one). Without the secrets — forks
      # — the build still succeeds but emits no `.sig`, and collection skips
      # the unsigned updater archives.
      - name: Build the app and its installers
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build ${{ matrix.args }}

      - name: Collect the bundles into dist/
        shell: bash
        run: |
          node scripts/collect-bundles.mjs \
            --label "${{ matrix.label }}" \
            --version "$APP_VERSION" \
            --target "${{ matrix.target }}" \
            --out dist

      # The .dmg is the friendly download; the .zip is the one that survives a
      # browser that refuses a disk image, and it is what a script installs.
      - name: Archive the .app as a zip
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          ditto -c -k --sequesterRsrc --keepParent "TunnelDeck.app" \
            "$GITHUB_WORKSPACE/dist/TunnelDeck-${APP_VERSION}-${{ matrix.label }}.zip"

      - name: Keep this platform's artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TunnelDeck-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish the release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # The feed script lives in the repo, not in the artifacts.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      # One release, every platform: each bundle job uploads to the same tag, so
      # the download page lists arm64 and x64 side by side instead of two
      # releases fighting over one name.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -l dist

      # The updater feed points at the release assets by exact name, so it is
      # rendered here — after every platform landed — and never by hand.
      # `--strict`: a feed missing a platform strands those users silently.
      - name: Render the updater feed
        run: node scripts/render-updater-json.mjs --tag "$GITHUB_REF_NAME" --dir dist --strict

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
